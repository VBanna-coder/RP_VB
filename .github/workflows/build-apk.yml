name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
    - uses: actions/checkout@v4
    - name: Build APK
      run: |
        set +e
        yes | buildozer -v android debug > /tmp/build.log 2>&1
        EXIT=$?
        echo "=== EXIT CODE: $EXIT ==="
        echo "=== LAST 120 LINES ==="
        tail -120 /tmp/build.log
        echo "=== BIN DIR ==="
        ls -la bin/ || echo "NO BIN DIR"
        exit $EXIT
    - name: Upload to Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.${{ github.run_number }}
        name: RP v0.1.${{ github.run_number }}
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
