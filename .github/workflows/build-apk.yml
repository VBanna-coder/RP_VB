name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
    - uses: actions/checkout@v4
    - name: Build APK
      run: |
        yes | buildozer -v android debug || true
        ls -la bin/ || true
    - uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        if-no-files-found: warn
