name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
    - name: Pre-accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        mkdir -p ~/.buildozer/android/platform
        echo "y" > /tmp/yes.txt
        for i in $(seq 1 200); do echo "y"; done > /tmp/yes_many.txt
    - name: Build APK
      run: |
        yes | buildozer -v android debug < /tmp/yes_many.txt || buildozer -v android debug < /tmp/yes_many.txt
    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v0.1.${{ github.run_number }}
        name: RP v0.1.${{ github.run_number }}
        files: bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
